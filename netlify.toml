# PE Falcon Safaris — public client (Next.js)
# Netlify reads this file from the repository root on deploy.

[build]
  base = "client"
  command = "npm ci && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Set in Netlify UI → Site settings → Environment variables:
# NEXT_PUBLIC_API_URL = https://your-production-api.example.com
